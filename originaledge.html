lastSp='';$('#sn').textContent='';
if(!$('#smw').hidden&&CFG.sb){const ids=hb.filter(x=>x.mode!='wait').slice(0,10).map(x=>x.id);
fetch(CFG.sb+'/rest/v1/rpc/last_specialist',{method:'POST',headers:{apikey:CFG.sbKey,'Content-Type':'application/json'},body:JSON.stringify({p_phone:sv.phone,p_ids:ids})}).then(r=>r.ok?r.json():null).then(n=>{if(typeof n=='string'&&n){lastSp=n;$('#sn').textContent=': '+n}}).catch(()=>{})}
$('#dF').showModal()}
$('#rs').onclick=()=>{try{localStorage.removeItem('spurP')}catch(e){}$('#f [name=name]').value='';$('#f [name=phone]').value='';$('#rs').hidden=true};
$('#wc').onchange=()=>$('#wol').hidden=$('#wc').value!='Other';
const go=m=>()=>{track(m=='now'?'ready_now_click':'waitlist_join');openForm(m)};
$('#now').onclick=go('now');$('#now2').onclick=go('now');$('#wl').onclick=go('wait');
$('#fnd').onclick=()=>{found=true;openForm('now')};
$('#cd').onclick=()=>{$('#co').textContent='';$('#dC').showModal()};
$('#ca').onclick=()=>{const v=$('#ci').value.trim();if(!v)return;code=v;$('#co').textContent=t('codeok');track('code_applied')};
$$('[data-x]').forEach(b=>b.onclick=()=>b.closest('dialog').close());
$$('dialog').forEach(d=>d.addEventListener('click',e=>{if(e.target===d)d.close()}));
$$('details').forEach(d=>d.addEventListener('toggle',()=>d.open&&track('faq_open')));
const phone=p=>{let d=(p||'').replace(/\D/g,'');if(d.length==10)d='1'+d;return d.length>=11&&d.length<=15?'+'+d:''};
const coolMsg=id=>{$('#err').innerHTML='<a target="_blank" rel="noopener" href="https://wa.me/'+CFG.wa+'?text='+encodeURIComponent('SPUR '+(id||'')+(fr()?' : je souhaite modifier ma demande.':': I need to modify my request.'))+'">'+t('cool')+'</a>'};
const wa=()=>'https://wa.me/'+CFG.wa+'?text='+encodeURIComponent(['SPUR '+last.id,last.city,'EDGE','SPUR Edge (15-Min Refinement)',last.name,last.code?'Code: '+last.code:'',last.same?(fr()?'Même spécialiste que la dernière fois':'Same specialist as last time')+(last.sp?' ('+last.sp+')':''):''].filter(Boolean).join('\n'));
$('#f').onsubmit=async e=>{e.preventDefault();const d=Object.fromEntries(new FormData(e.target));if(d.website)return;
const ph=phone(d.phone);if(!ph){$('#err').textContent=t('ephone');return}
try{const lk=JSON.parse(localStorage.getItem('spurLock')||'null');if(mode=='now'&&lk&&lk.p==ph&&lk.u>Date.now()){coolMsg(lk.id);return}}catch(x){}
const c=mode=='wait'?(d.wc=='Other'?(d.wo||'Other'):d.wc):city;
last={id:'SP-'+[...crypto.getRandomValues(new Uint8Array(6))].map(x=>(x%36).toString(36)).join('').toUpperCase(),mode,city:c,name:d.name.trim(),phone:ph,same:!!d.same,sp:d.same?lastSp:'',tier:'edge',occ:'SPUR Edge (15-Min Refinement)',date:'',time:'',ref:d.ref||'',code,founding:found,lang:L,ts:new Date().toISOString()};
const b=$('#go');b.disabled=true;
const post=async(u,h,body)=>{try{const ac=new AbortController();setTimeout(()=>ac.abort(),8e3);const r=await fetch(u,{method:'POST',headers:h,body:JSON.stringify(body),signal:ac.signal});return r.ok||r.status==409}catch(x){return false}};
const sl=(v,n)=>String(v||'').slice(0,n);let ok=false;
const sbp=async body=>{try{const ac=new AbortController();setTimeout(()=>ac.abort(),8e3);const r=await fetch(CFG.sb+'/rest/v1/spur_requests',{method:'POST',headers:{apikey:CFG.sbKey,'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(body),signal:ac.signal});if(r.ok||r.status==409)return 'ok';const j=await r.json().catch(()=>({}));return /SPUR_COOLDOWN/.test(j.message||'')?'cool':'fail'}catch(x){return 'fail'}};
let cool=false;
if(CFG.sb){const r=await sbp({request_id:last.id,mode:last.mode,city:sl(last.city,60),name:sl(last.name,100),phone:last.phone,tier:sl(last.tier,20),occasion:sl(last.occ,120),visit_date:last.date,visit_time:last.time,referral:sl(last.ref,40),code:sl(last.code,40),founding:!!last.founding,lang:last.lang,same_specialist:!!last.same,consent:true});if(r=='cool')cool=true;else ok=r=='ok';if(!ok&&!cool)track('backend_fail',{b:'supabase'})}
if(cool){b.disabled=false;coolMsg();return}
if(!ok&&CFG.endpoint)ok=await post(CFG.endpoint,{'Content-Type':'application/json',Accept:'application/json'},last);
b.disabled=false;track(ok?'form_submit':'form_error',{mode});
if(!ok){$('#err').innerHTML='<a target="_blank" rel="noopener" href="'+wa()+'">'+t('eg')+'</a>';return}
try{localStorage.setItem('spurP',JSON.stringify({name:last.name,phone:last.phone}));if(last.mode=='now')localStorage.setItem('spurLock',JSON.stringify({p:last.phone,id:last.id,u:Date.now()+120000}))}catch(x){}
try{const a=JSON.parse(localStorage.getItem('spurB')||'[]');a.unshift(last);localStorage.setItem('spurB',JSON.stringify(a.slice(0,10)))}catch(x){}
done()};
function done(){const w=last.mode=='wait',pr=29.99,disc=false;
$('#dF').close();$('#f').reset();$('#cdsc').textContent=t(w?'wd':'cd1');$('#cdet').hidden=w;
$('#clab').textContent=disc?t('fp'):t('tot');$('#ctot').textContent=money(disc?39.99:pr)+' · '+CFG.tax[L];
$('#cid').textContent=last.id;$('#cloc').textContent=last.city;$('#pay').textContent=CFG.pay||t('pay');
$('#cwa').href=wa();$('#chg').href='https://wa.me/'+CFG.wa+'?text='+encodeURIComponent('SPUR '+last.id+(fr()?' : je dois modifier ma demande.':': I need to modify my request.'));
$('#dD').showModal()}
$('#cwa').addEventListener('click',()=>track('whatsapp_confirm_click'));
$('#bk').onclick=()=>{let a=[];try{a=JSON.parse(localStorage.getItem('spurB')||'[]')}catch(e){}
const l=$('#bl');l.innerHTML=a.length?'':'<p class="mu">'+t('none')+'</p>';
a.forEach(x=>{const r=document.createElement('p');r.textContent=x.id+' · '+x.city+' · '+(fr()?'Edge':'Edge');
const b=document.createElement('button');b.className='lnk';b.textContent=t('again');b.onclick=()=>{$('#dB').close();track('book_again_click');openForm(x.mode=='wait'?'now':x.mode,x)};r.append(b);l.append(r)});
$('#dB').showModal()};
if('IntersectionObserver'in window)new IntersectionObserver(([e])=>$('#bar').classList.toggle('show',!e.isIntersecting)).observe($('#ctas'));
apply();
</script>
</body>
</html>
